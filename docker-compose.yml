services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wealth_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./database/migrations/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wealth_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./python_backend
    environment:
      APP_NAME: Wealth Monitor
      APP_VERSION: 1.0.0
      DEBUG: "false"
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: wealth_monitor
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET_KEY: local-dev-secret-change-me
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 1440
      CORS_ORIGINS_RAW: http://localhost:5173,http://localhost:3000,http://localhost
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./react_frontend
      args:
        VITE_API_URL: /api/v1
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
